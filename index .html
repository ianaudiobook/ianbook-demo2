<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IANBOOK</title>
<style>
  :root{
    --paper:#FFFFFF; --ink:#1E2A38; --muted:#7A8594; --rule:#E6E9EE;
    --marker:#FFF3B0; --marker-edge:#E8B900; --section:#1F6F78; --btn:#1E2A38;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",-apple-system,sans-serif;
    font-size:17px;line-height:1.7;-webkit-text-size-adjust:100%}
  header{position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--rule);
    padding:12px 18px;display:flex;align-items:baseline;justify-content:space-between;z-index:2}
  header h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
  header small{color:var(--muted);font-size:13px}
  main{max-width:620px;margin:0 auto;padding:8px 0 140px}
  .s.h{margin-top:22px;grid-template-columns:1fr;padding-left:30px}
  .s.h .t{font-size:14px;font-weight:700;color:var(--section)}
  .s{display:grid;grid-template-columns:34px 1fr;padding:9px 18px 9px 12px;cursor:pointer;
    border-left:4px solid transparent;transition:background .15s}
  .s:hover{background:#F6F7F9}
  .s .n{color:var(--muted);font-size:12px;padding-top:6px;text-align:right;padding-right:10px}
  .s .t{white-space:pre-line}
  .s.on{background:var(--marker);border-left-color:var(--marker-edge)}
  .s.on .n{color:var(--ink)}
  .s.none .t{color:var(--muted)}
  .s .note{display:block;margin-top:4px;font-size:13px;color:var(--muted);line-height:1.5}
  .s a{display:inline-block;margin-top:6px;font-size:13px;color:var(--section);
    border:1px solid var(--section);border-radius:6px;padding:2px 10px;text-decoration:none}
  .s a:focus,.s:focus-visible{outline:2px solid var(--section);outline-offset:2px}
  footer{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--rule);
    padding:10px 18px calc(12px + env(safe-area-inset-bottom));z-index:2}
  .bar{max-width:620px;margin:0 auto}
  .row{display:flex;align-items:center;gap:14px}
  button{font:inherit;cursor:pointer}
  #play{width:52px;height:52px;border-radius:50%;border:0;background:var(--btn);color:#fff;font-size:20px;flex:none}
  #seek{flex:1;accent-color:var(--section)}
  .time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);width:92px;text-align:right}
  .speed{display:flex;gap:6px;margin-top:8px;justify-content:flex-end}
  .speed button{border:1px solid var(--rule);background:#fff;border-radius:6px;padding:2px 10px;font-size:13px;color:var(--muted)}
  .speed button.on{border-color:var(--ink);color:var(--ink)}
  .empty{margin:60px 18px;color:var(--muted);text-align:center}
  @media (prefers-reduced-motion:reduce){.s{transition:none}}
</style>
</head>
<body>
<header><h1 id="title">IANBOOK</h1><small id="sub">문장을 누르면 그 대목부터 다시 듣습니다</small></header>
<main id="list"><p class="empty">sentences.json 을 읽는 중입니다.</p></main>
<footer><div class="bar">
  <div class="row">
    <button id="play" aria-label="재생">▶</button>
    <input id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="재생 위치">
    <span class="time" id="time">0:00 / 0:00</span>
  </div>
  <div class="speed" id="speed">
    <button data-r="0.7">0.7×</button><button data-r="0.85">0.85×</button>
    <button data-r="1" class="on">1×</button><button data-r="1.2">1.2×</button>
  </div>
</div></footer>
<audio id="audio" preload="metadata"></audio>

<script>
const $=s=>document.querySelector(s);
const audio=$('#audio'), list=$('#list');
let S=[], cur=-1, seeking=false;

const fmt=t=>{t=Math.max(0,t|0);return (t/60|0)+':'+String(t%60).padStart(2,'0')};

fetch('sentences.json').then(r=>r.json()).then(d=>{
  $('#title').textContent=d.title||'IANBOOK';
  audio.src=d.audio||'final.mp3';
  S=d.sentences; list.innerHTML='';
  S.forEach((s,i)=>{
    const el=document.createElement('div');
    el.className='s'+(s.heading?' h':'')+(s.start==null?' none':''); el.tabIndex=0; el.dataset.i=i;
    el.innerHTML=`${s.heading?'':`<div class="n">${s.id}</div>`}<div class="t">${s.display}${s.note?`<span class="note">${s.note}</span>`:''}${
      s.link&&s.link.url?`<br><a href="${s.link.url}" target="_blank" rel="noopener">${s.link.label}</a>`:''}</div>`;
    const go=e=>{if(e.target.tagName==='A')return; if(s.start==null)return;
      audio.currentTime=s.start; audio.play();};
    el.addEventListener('click',go);
    el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go(e);}});
    list.appendChild(el);
  });
}).catch(()=>{list.innerHTML='<p class="empty">sentences.json 을 찾지 못했습니다. player.html 과 같은 폴더에 두기 바랍니다.</p>'});

function mark(i){
  if(i===cur)return;
  document.querySelectorAll('.s.on').forEach(e=>e.classList.remove('on'));
  cur=i; if(i<0)return;
  const el=list.querySelector(`.s[data-i="${i}"]`);
  el.classList.add('on');
  const r=el.getBoundingClientRect();
  if(r.top<70||r.bottom>innerHeight-150) el.scrollIntoView({block:'center',behavior:'smooth'});
}
audio.addEventListener('timeupdate',()=>{
  const t=audio.currentTime;
  let i=S.findIndex(s=>s.start!=null&&t>=s.start&&t<s.end);
  if(i<0){ // 문장 사이 쉼 구간이면 직전 문장을 유지
    for(let k=S.length-1;k>=0;k--){if(S[k].start!=null&&t>=S[k].start){i=k;break;}}
  }
  mark(i);
  if(!seeking)$('#seek').value=audio.duration?t/audio.duration*100:0;
  $('#time').textContent=fmt(t)+' / '+fmt(audio.duration||0);
});
audio.addEventListener('play',()=>$('#play').textContent='❚❚');
audio.addEventListener('pause',()=>$('#play').textContent='▶');
audio.addEventListener('ended',()=>mark(-1));
$('#play').onclick=()=>audio.paused?audio.play():audio.pause();
$('#seek').oninput=()=>{seeking=true;};
$('#seek').onchange=e=>{audio.currentTime=e.target.value/100*audio.duration;seeking=false;};
$('#speed').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  audio.playbackRate=+b.dataset.r;
  $('#speed').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));};
</script>
</body>
</html>
