<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>이야기 엮기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: a classroom workbench — step rail on top, the student's work on the left, the AI helper on the right, the finished book as the last step. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --sunk:#e9edf2; --line:#d6dce5;
  --ink:#1c2331; --muted:#5d6676;
  --accent:#2f4f9e; --accent-soft:#e2e8f6;
  --mine:#a8530f; --mine-soft:#f7eadb;
  --ai:#674a9c; --ai-soft:#eee8f7;
  --ok:#2b7650; --ok-soft:#e0f0e7; --warn:#9a6a00; --warn-soft:#f8efd3;
  --display:"Gowun Batang","Nanum Myeongjo",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141820; --surface:#1c212b; --sunk:#252b37; --line:#353d4c; --ink:#e8ebf1; --muted:#a0a8b7;
  --accent:#93acec; --accent-soft:#25304a; --mine:#e8a865; --mine-soft:#3a2b1b;
  --ai:#c2a8ef; --ai-soft:#2e2541; --ok:#7fd0a3; --ok-soft:#1c3328; --warn:#e7c25e; --warn-soft:#3a3016; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141820; --surface:#1c212b; --sunk:#252b37; --line:#353d4c; --ink:#e8ebf1; --muted:#a0a8b7;
  --accent:#93acec; --accent-soft:#25304a; --mine:#e8a865; --mine-soft:#3a2b1b;
  --ai:#c2a8ef; --ai-soft:#2e2541; --ok:#7fd0a3; --ok-soft:#1c3328; --warn:#e7c25e; --warn-soft:#3a3016; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:18px 56px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:18px}
button,select,input,textarea{font:inherit;color:var(--ink)}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;justify-content:space-between}
.brand small{display:block;font-size:12.5px;color:var(--accent);font-weight:600;letter-spacing:.04em}
.brand h1{margin:2px 0 0;font-family:var(--display);font-size:clamp(26px,4vw,34px);font-weight:700;text-wrap:balance}
.brand p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.sample{font-size:12.5px;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:7px 11px;max-width:420px}

/* step rail */
.rail{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.rail ol{display:flex;margin:0;padding:6px;list-style:none;gap:4px;min-width:max-content}
.rail button{display:flex;align-items:center;gap:8px;border:0;background:none;border-radius:8px;padding:8px 12px;color:var(--muted);white-space:nowrap}
.rail button b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--sunk);font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums}
.rail button[aria-current="step"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.rail button[aria-current="step"] b{background:var(--accent);color:var(--surface)}

/* work area */
.work{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:920px){.work{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.ph{padding:14px 18px 10px;border-bottom:1px solid var(--line);display:grid;gap:2px}
.ph h2{margin:0;font-size:17px;font-weight:700}
.ph p{margin:0;color:var(--muted);font-size:13.5px}
.pb{padding:16px 18px;display:grid;gap:14px;min-width:0}
.nav{display:flex;justify-content:space-between;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.btn:disabled{opacity:.4;cursor:not-allowed}
.sm{font-size:12.5px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:3px 9px}
.label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em}

/* step 1: shelf */
.shelf{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}
.book{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface);text-align:left;display:grid;gap:4px}
.book[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.book b{font-family:var(--display);font-size:16.5px}
.book span{font-size:12.5px;color:var(--muted)}
.scene h3{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:600}
.sent{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;align-items:start;padding:6px 8px;border-radius:8px}
.sent:hover{background:var(--sunk)}
.sent.in{background:var(--ok-soft)}
.code{font-size:11.5px;color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}
.st{font-family:var(--display);font-size:16px;line-height:1.6}
.acts{display:flex;gap:4px}

/* chat */
.chat{display:grid;gap:10px;max-height:460px;overflow:auto;padding:14px 16px}
.msg{display:grid;gap:3px;max-width:92%}
.msg .who{font-size:11.5px;color:var(--muted)}
.msg .bub{padding:9px 12px;border-radius:13px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}
.msg.ai .bub{background:var(--ai-soft);border-top-left-radius:4px}
.msg.me{justify-self:end}
.msg.me .who{text-align:right}
.msg.me .bub{background:var(--accent);color:var(--surface);border-top-right-radius:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 12px}
.chip{font-size:13px;border:1px solid var(--ai);color:var(--ai);background:var(--surface);border-radius:999px;padding:4px 11px}
.chatnote{margin:0;padding:0 16px 14px;font-size:12.5px;color:var(--muted)}

/* forms */
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.field{display:grid;gap:5px}
select,input[type=text],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:46px;font-family:var(--display);font-size:15.5px}
.reader{border:1px dashed var(--line);border-radius:12px;padding:14px;display:grid;gap:6px;background:var(--sunk)}
.reader b{font-family:var(--display);font-size:17px}

/* formats */
.formats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
.fmt{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);text-align:left;display:grid;gap:6px}
.fmt[aria-pressed="true"]{border-color:var(--ai);background:var(--ai-soft)}
.fmt b{font-size:15px}
.fmt small{color:var(--muted);font-size:12.5px}
.fmt .eg{font-family:var(--display);font-size:14px;border-left:3px solid var(--line);padding-left:8px}

/* story items */
.items{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:8px;background:var(--surface)}
.item .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between}
.tag{font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.k-orig{background:var(--sunk);color:var(--muted)}
.k-edit{background:var(--mine-soft);color:var(--mine)}
.k-aiedit{background:var(--mine-soft);color:var(--mine);box-shadow:inset 0 0 0 1px var(--ai)}
.k-aiasis{background:var(--ai-soft);color:var(--ai)}
.k-new{background:var(--mine);color:var(--surface)}
.hard{background:var(--warn-soft);color:var(--warn);border-radius:3px;padding:0 2px}
.orig{font-size:12.5px;color:var(--muted)}
.opts{display:grid;gap:6px}
.opt{text-align:left;border:1px solid var(--ai);background:var(--ai-soft);border-radius:8px;padding:7px 10px;font-family:var(--display);font-size:15px}
.opt[aria-pressed="true"]{outline:2px solid var(--ai)}
.why{font-size:12.5px;color:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:8px}

/* vocab, quiz */
.vocab{display:grid;gap:8px}
.voc{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,120px) minmax(0,1fr);gap:6px 12px;align-items:center}
@media (max-width:560px){.voc{grid-template-columns:minmax(0,1fr)}}
.voc .w{font-family:var(--display);font-size:18px;font-weight:700}
.voc .vi{font-size:12.5px;color:var(--muted)}
.voc label{display:flex;gap:6px;align-items:center;font-size:13px}
.voc.unchecked{border-color:var(--warn);background:var(--warn-soft)}
.q{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.q b{font-family:var(--display);font-size:15.5px}
.q ol{margin:0;padding-left:20px;font-size:14px}
.q .ans{color:var(--ok);font-weight:600}

/* voices */
.vrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
@media (max-width:640px){.vrow{grid-template-columns:minmax(0,1fr)}}
.vrow .st{font-size:15px}
.vsel{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:4px 10px;font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.vsel select{width:auto;padding:4px 8px;font-size:12.5px}
.rec{font-size:12.5px;border:1px solid var(--mine);color:var(--mine);background:var(--surface);border-radius:7px;padding:3px 9px}
.rec.done{background:var(--mine-soft)}

/* book */
.bookpage{background:var(--surface);border:1px solid var(--line);border-radius:4px 14px 14px 4px;box-shadow:6px 6px 0 -2px var(--sunk);padding:clamp(18px,4vw,40px);display:grid;gap:14px;max-width:720px;width:100%;margin:0 auto}
.bookpage .for{font-size:12.5px;color:var(--accent);font-weight:600;text-align:center}
.bookpage h3{margin:0;text-align:center;font-family:var(--display);font-size:clamp(24px,3.6vw,30px)}
.bookpage .src{text-align:center;color:var(--muted);font-size:13px;margin:0}
.bookpage .text{font-family:var(--display);font-size:17.5px;line-height:2;margin:0}
.bookpage .text span{border-radius:3px}
.bookpage .text sup{font-family:var(--body);font-size:10px;color:var(--muted);margin-left:1px}
.t-edit,.t-aiedit,.t-aiasis,.t-new{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px}
.t-edit,.t-aiedit,.t-new{text-decoration-color:var(--mine)}
.t-aiasis{text-decoration-color:var(--ai);text-decoration-style:dashed}
.t-playing{background:var(--accent-soft)}
.section h4{margin:0 0 6px;font-size:14px}
.minitable{width:100%;border-collapse:collapse;font-size:13.5px}
.minitable td,.minitable th{border-top:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:top}
.minitable th{font-size:12px;color:var(--muted);font-weight:600}
.tw{overflow-x:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,108px),1fr));gap:8px}
.stat{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:21px;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:12px}
.report{border:1px dashed var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:10px;background:var(--sunk)}
.foot{font-size:12.5px;color:var(--muted);text-align:center}
.narr-on{color:var(--ok)!important;font-weight:600}
.cats{justify-self:start}
.cats button{padding:6px 12px;font-size:13.5px}
.sm:disabled{opacity:.35;cursor:not-allowed}
.undo{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--ink);color:var(--surface);border-radius:10px;padding:8px 12px;font-size:13.5px}
.undo .sm{background:transparent;color:var(--surface);border-color:var(--surface)}
.mylist{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}
.mylist .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between}
.mini{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.mini li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;padding:4px 6px;border-radius:7px;background:var(--sunk)}
.mt{font-family:var(--display);font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.msg{animation:in .2s ease-out}@keyframes in{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}}
</style>
<style>body{margin:0}</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div class="brand">
      <small>낭독도서관 × AI</small>
      <h1>이야기 엮기</h1>
      <p>낭독도서관의 이야기로 외국인 친구를 위한 한국어 이야기책을 만들어요.</p>
    </div>
    <div class="sample">시연용 샘플입니다. AI 도우미의 대답은 미리 정해 둔 예시입니다.<br><span id="audioStat">성우 음원: ▶를 누르면 연결을 확인해요</span></div>
  </header>

  <nav class="rail" aria-label="만들기 단계"><ol id="rail"></ol></nav>

  <div class="work">
    <section class="panel" aria-labelledby="stepH">
      <div class="ph"><h2 id="stepH"></h2><p id="stepP"></p></div>
      <div class="pb" id="stepBody"></div>
      <div class="nav"><button class="btn" id="prev" type="button">이전 단계</button><button class="btn primary" id="next" type="button">다음 단계</button></div>
    </section>
    <aside class="panel" aria-labelledby="aiH">
      <div class="ph"><h2 id="aiH">AI 도우미</h2><p>함께 의논하지만, 고르고 정하는 건 내가 해요.</p></div>
      <div class="chat" id="chat" aria-live="polite"></div>
      <div class="chips" id="chips"></div>
      <p class="chatnote">샘플에서는 아래 버튼으로만 물어볼 수 있어요.</p>
    </aside>
  </div>
  <p class="foot">오디오펍 · 낭독도서관 AI 활용교육 샘플 · 이야기는 모두 저작권이 만료된 작품이고, 생활 콘텐츠는 오디오펍 자체 원고 예시입니다.</p>
</div>

<script>
(() => {
/* ---------------- data ---------------- */
const BOOKS = [
  {id:'yeo', code:'여', narr:true, title:'여우와 신 포도', origin:'이솝 우화', scenes:[
    {t:'포도를 발견한 여우', s:[[1,'아주 더운 여름날이었어요.'],[2,'배가 고픈 여우가 숲길을 걷다가, 포도밭을 발견했지요.'],[3,'덩굴에 포도송이가 주렁주렁 달려 있었어요.'],[4,'포도는 햇빛을 받아 반짝반짝 빛났고, 알알이 통통해서 정말 맛있어 보였답니다.'],[5,'여우는 침을 꿀꺽 삼켰어요.'],[6,'“한 송이만 먹어도 배가 든든하겠다!”'],[7,'그런데 포도는 아주 조금, 여우의 손이 닿지 않는 곳에 달려 있었어요.'],[8,'여우는 발을 굴러 힘을 모았어요.'],[9,'“좋아! 한 번에 뛰면 되지!”'],[10,'휙— 하고 높이 뛰었지만, 포도는 손끝에서 살짝 멀었어요.'],[11,'여우는 다시 한 번 뛰었어요.'],[12,'이번에는 더 높이, 더 힘껏요.'],[13,'하지만 포도는 여전히 높은 곳에서 조용히 달랑달랑 흔들릴 뿐이었답니다.']]},
    {t:'포기하지 않는 여우', s:[[14,'여우는 포기하지 않았어요.'],[15,'조금 뒤로 물러나 달려가기도 하고, 더 큰 힘으로 뛰어오르기도 했지요.'],[16,'“이번엔 될 것 같아!”'],[17,'“이번엔 잡을 수 있을 거야!”'],[18,'하지만 포도는 생각보다 더 높았어요.'],[19,'여우는 숨이 차고 다리도 아파졌답니다.'],[20,'여우는 잠깐 멈춰 서서 포도송이를 올려다봤어요.'],[21,'배는 고픈데, 포도는 따먹을 수가 없었지요.']]},
    {t:'돌아서는 여우', s:[[22,'마침내 여우는 고개를 돌렸어요.'],[23,'그리고 포도밭을 떠나며 혼잣말을 했답니다.'],[24,'“흥, 저 포도는 어차피 시어!”'],[25,'“겉보기만 그럴싸하지, 맛없을 거야!”'],[26,'여우는 그렇게 말하고는 숲길을 따라 걸어갔어요.'],[27,'하지만 여우의 배는 여전히 고팠답니다.'],[28,'이 이야기는 우리에게 조용히 말해요.'],[29,'원하는 걸 못 얻으면 속상한 마음이 생길 수 있어요.'],[30,'그럴 때는 못 얻은 것을 괜히 나쁘게 말하고 싶어질 때도 있답니다.'],[31,'하지만 “아쉽다” 하고 솔직하게 말해 주는 게 더 편안할 수도 있어요.']]}
  ]},
  {id:'ga', code:'가', title:'의좋은 형제', origin:'한국 전래동화', scenes:[

function narrFallback(id, onend){
  narrFails++; setAudioStat();
  if (!warned){ warned = true; addAI('이 문장은 성우 음원 파일이 아직 연결되지 않아서 기기 음성으로 대신 들려줘요. audio 폴더에 성우 음원을 넣으면 성우 목소리로 나와요.'); }
  speak(ORIG[id], {rate:.92, onend});
}
function playNarr(id, onend){
  // 성우 음원이 연결된 작품만 음원을 찾고, 나머지는 기기 음성으로 들려줌
  if (!B[id.split('-')[0]].narr) return speak(ORIG[id], {rate:.92, onend});
  const fid = fileId(id), seg = TIMINGS && TIMINGS[fid];
  let a;
  try{
    if (seg){ a = prepare(seg.file); if (a._blobUrl && a.src !== a._blobUrl){ a.src = a._blobUrl; a.load(); } }
    else a = new Audio(AUDIO_DIR + fid + '.mp3');
  }catch(e){ return narrFallback(id, onend); }
  const token = {}; a._token = token; clearInterval(a._timer); audioEl = a;
  const live = () => a._token === token;
  const finish = () => { if (!live()) return; a._token = null; clearInterval(a._timer); try{ a.pause(); }catch(e){} if (audioEl === a) audioEl = null; if (onend) onend(); };
  const fail = () => { if (!live()) return; a._token = null; clearInterval(a._timer); if (audioEl === a) audioEl = null; narrFallback(id, onend); };
  a.onerror = fail;
  a.onended = finish;
  const start = () => {
    if (!live()) return;
    if (seg){
      try{ a.currentTime = seg.start; }catch(e){}
      a._timer = setInterval(() => { if (!live()) return clearInterval(a._timer); if (a.currentTime >= seg.end) finish(); }, 30);
    }
    const p = a.play();
    if (p && p.then) p.then(() => { narrOK++; setAudioStat(); }).catch(err => { if (!(err && err.name === 'AbortError')) fail(); });
  };
  if (!seg || a.readyState >= 1) start(); else a.addEventListener('loadedmetadata', start, {once:true});
}
const POOL = {};
// 한 편 전체 음원을 미리 받아 두면 서버 종류와 상관없이 원하는 구간으로 바로 이동할 수 있음
function prepare(file){
  if (POOL[file]) return POOL[file];
  const a = new Audio(AUDIO_DIR + file); a.preload = 'auto'; POOL[file] = a;
  try{
    fetch(AUDIO_DIR + file).then(r => r.ok ? r.blob() : null).then(b => {
      if (!b) return;
      a._blobUrl = URL.createObjectURL(b);
      if (a.paused && !a._token){ a.src = a._blobUrl; a.load(); }
    }).catch(() => {});
  }catch(e){}
  return a;
}
function sayItem(it, onend){
  if (it.id && it.v && it.v.type === 'narr' && kind(it) === 'orig') return playNarr(it.id, onend);
  speak(text(it), {...voiceParams(it), onend});
}

const cut = s => s.length > 24 ? s.slice(0, 24) + '…' : s;
function removeItem(i){
  const [it] = state.items.splice(i, 1);
  state.undo = {it, i}; state.open = {}; state.confirmClear = false; stopAll(); renderStep();
}
function undoBar(){
  const u = state.undo; if (!u) return '';
  return `<div class="undo" role="status"><span>${u.all ? `담은 문장 ${u.all.length}개를 모두 뺐어요.` : `「${esc(cut(text(u.it)))}」 문장을 뺐어요.`}</span><button class="sm" type="button" data-undo>되돌리기</button></div>`;
}
function myList(){
  const n = state.items.length;
  return `<div class="mylist"><div class="row"><span class="label">내 책에 담은 문장 ${n}개</span>
    ${!n ? '' : state.confirmClear
      ? `<span class="acts"><span class="label">모두 뺄까요?</span><button class="sm" type="button" data-clearyes>모두 빼기</button><button class="sm" type="button" data-clearno>취소</button></span>`
      : `<button class="sm" type="button" data-clearask>모두 빼기</button>`}</div>
    ${n ? `<ol class="mini">${state.items.map((it, i) => `<li><span class="code">${i + 1}.</span><span class="mt">${esc(text(it))}</span><button class="sm" type="button" data-del="${i}" aria-label="${i + 1}번 문장 빼기">✕</button></li>`).join('')}</ol>`
        : '<p class="label" style="margin:0">아직 담은 문장이 없어요. 문장 옆 ＋를 눌러 담아 보세요.</p>'}</div>`;
}
function voiceParams(it){
  const v = it.v || {type:'narr'};
  if (v.type === 'ai') return {rate: v.speed === 'slow' ? .72 : 1, pitch: AIV[v.ai].pitch};
  if (v.type === 'me') return {rate: .95, pitch: 1.2};
  return {rate: .92, pitch: 1};
}

function renderStep(){
  const s = STEPS[state.step];
  $('stepH').textContent = s.h; $('stepP').textContent = s.p;
  $('stepBody').innerHTML = R[s.k]();
  $('prev').disabled = state.step === 0;
  $('next').textContent = state.step === STEPS.length - 1 ? '처음으로' : '다음 단계';
  renderRail(); renderChat();
}
function go(i){ stopAll(); state.undo = null; state.confirmClear = false; state.step = Math.max(0, Math.min(STEPS.length - 1, i)); renderStep(); try{ history.replaceState(null, '', '#s' + (state.step + 1)); }catch(e){} window.scrollTo({top:0, behavior:'smooth'}); }

/* ---------------- events ---------------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if (d.go != null) return go(+d.go);
  if (d.ask){ const k = STEPS[state.step].k; chatFor(k).push({r:'me', t:d.ask}, {r:'ai', t:SCRIPT[k].chips[d.ask]}); return renderChat(); }
  if (d.cat){ state.cat = d.cat; state.book = BOOKS.find(x => catOf(x) === d.cat).id; return renderStep(); }
  if (d.book){ state.book = d.book; return renderStep(); }
  if (d.listen){ stopAll(); return playNarr(d.listen); }
  if (d.add){
    const i = state.items.findIndex(it => it.id === d.add);
    if (i >= 0) return removeItem(i);
    state.undo = null;
    state.items.push({k:'x', id:d.add, v:{type:'narr', ai:'story', speed:'slow', rec:false}});
    return renderStep();
  }
  if (d.del != null) return removeItem(+d.del);
  if (d.mv){
    const [i, dir] = d.mv.split(':').map(Number), j = i + dir;
    if (j < 0 || j >= state.items.length) return;
    [state.items[i], state.items[j]] = [state.items[j], state.items[i]];
    state.open = {}; return renderStep();
  }
  if (d.clearask != null){ state.confirmClear = true; return renderStep(); }
  if (d.clearno != null){ state.confirmClear = false; return renderStep(); }
  if (d.clearyes != null){ stopAll(); state.undo = {all: state.items}; state.items = []; state.open = {}; state.confirmClear = false; return renderStep(); }
  if (d.undo != null){
    const u = state.undo; if (!u) return;
    if (u.all) state.items = u.all; else state.items.splice(Math.min(u.i, state.items.length), 0, u.it);
    state.undo = null; state.open = {}; return renderStep();
  }
  if (d.fmt){ state.format = d.fmt; return renderStep(); }
  if (d.open != null){ state.open[d.open] = !state.open[d.open]; renderStep(); const ta = $('ed' + d.open); if (ta) ta.focus(); return; }
  if (d.aiopt != null){ state.open['ai' + d.aiopt] = !state.open['ai' + d.aiopt]; return renderStep(); }
  if (d.pickopt){ const [i, j] = d.pickopt.split(':').map(Number); const it = state.items[i]; it.ai = AIOPT[it.id].o[j]; it.t = it.ai; state.open['ai' + i] = false; fixVoice(it); return renderStep(); }
  if (d.reset != null){ const it = state.items[+d.reset]; delete it.t; delete it.ai; state.open[d.reset] = false; it.v.type = 'narr'; return renderStep(); }
  if (d.confirm != null){ const it = state.items[+d.confirm]; it.ai = null; return renderStep(); }
  if (d.addline != null){ const v = $('newLine').value.trim(); if (!v) return $('newLine').focus(); state.items.push({k:'m', t:v, v:{type:'me', ai:'story', speed:'slow', rec:false}}); return renderStep(); }
  if (d.vt){ const [i, ty] = d.vt.split(':'); state.items[+i].v.type = ty; return renderStep(); }
  if (d.vs){ const [i, sp] = d.vs.split(':'); state.items[+i].v.speed = sp; return renderStep(); }
  if (d.rec != null){ const v = state.items[+d.rec].v; v.rec = true; addAI('샘플에서는 실제로 녹음하지 않아요. 실제 서비스에서는 녹음한 뒤 잡음 제거와 음량 보정이 자동으로 들어가요.'); return renderStep(); }
  if (d.play != null){ stopAll(); return sayItem(state.items[+d.play]); }
  if (d.playall != null){ stopAll(); playFrom(0); return; }
  if (d.stop != null) return stopAll();
});
function playFrom(i){
  document.querySelectorAll('.t-playing').forEach(e => e.classList.remove('t-playing'));
  if (i >= state.items.length) return;
  const it = state.items[i], el = $('bt' + i); if (el) el.classList.add('t-playing');
  playingIdx = i;
  sayItem(it, () => { if (playingIdx === i) playFrom(i + 1); });
}
function fixVoice(it){ if (kind(it) !== 'orig' && it.v.type === 'narr') it.v.type = 'ai'; }
document.addEventListener('input', e => {
  const el = e.target, d = el.dataset;
  if (d.edit != null){ const it = state.items[+d.edit]; if (it.k === 'm') it.t = el.value; else it.t = el.value; fixVoice(it); return; }
  if (el.id === 'title'){ state.title = el.value; return; }
  if (el.id === 'rName'){ state.reader.name = el.value; return; }
  if (d.voc != null){ state.vocab[+d.voc].easy = el.value; return; }
});
document.addEventListener('change', e => {
  const el = e.target, d = el.dataset;
  if (d.edit != null) return renderStep();
  if (el.id === 'rCountry'){ state.reader.country = el.value; return renderStep(); }
  if (el.id === 'rLevel'){ state.reader.level = el.value; return renderStep(); }
  if (el.id === 'rLike'){ state.reader.like = el.value; return renderStep(); }
  if (el.id === 'rName') return renderStep();
  if (d.vok != null){ state.vocab[+d.vok].ok = el.checked; return renderStep(); }
  if (d.vai != null){ state.items[+d.vai].v.ai = el.value; return; }
});
$('prev').onclick = () => go(state.step - 1);
$('next').onclick = () => go(state.step === STEPS.length - 1 ? 0 : state.step + 1);

const m = /^#s([1-7])$/.exec(location.hash || '');
if (m) state.step = +m[1] - 1;
renderStep();
try{
  fetch(AUDIO_DIR + 'timings.json').then(r => r.ok ? r.json() : null)
    .then(j => {
      if (j && typeof j === 'object'){ TIMINGS = j; [...new Set(Object.values(j).map(v => v.file))].forEach(prepare); }
      setAudioStat();
    }).catch(() => setAudioStat());
}catch(e){ setAudioStat(); }
})();
</script>
