<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학식 첫날 — IANBOOK 웹툰 시연</title>
<style>
  :root{
    --ink:#22262b; --paper:#ffffff; --bg:#dfe7ea;
    --active:#ffe86b; --rina:#2f6aa8; --junho:#9a5a1e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
  .wrap{max-width:440px;margin:0 auto;padding:0 0 110px}
  header{padding:24px 18px 6px}
  header h1{font-size:26px;margin:0 0 6px;letter-spacing:-.02em}
  header p{margin:0;font-size:13.5px;color:#4d555c;line-height:1.55}

  .panel{position:relative;margin:16px 12px 0;background:var(--paper);
    border:2.5px solid var(--ink);border-radius:4px}
  .panel svg{display:block;width:100%;height:auto}

  .bubble{position:absolute;background:#fff;border:2px solid var(--ink);
    border-radius:18px;padding:7px 11px 8px;font-size:15px;line-height:1.4;
    cursor:pointer;user-select:none;max-width:52%;
    transition:background-color .15s,transform .15s}
  .bubble:focus-visible{outline:3px solid var(--rina);outline-offset:2px}
  .bubble .who{display:block;font-size:11px;font-weight:700;margin-bottom:1px}
  .bubble[data-who="리나"] .who{color:var(--rina)}
  .bubble[data-who="준호"] .who{color:var(--junho)}
  .bubble::after{content:"";position:absolute;width:11px;height:11px;background:inherit;
    border:2px solid var(--ink);border-top:none;border-left:none;transform:rotate(45deg);bottom:-7.5px}
  .bubble.tl::after{left:16px}
  .bubble.tr::after{right:16px}
  .bubble.active{background:var(--active);transform:scale(1.04)}

  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2.5px solid var(--ink)}
  .bar .in{max-width:440px;margin:0 auto;padding:10px 12px;display:flex;align-items:center;gap:8px}
  button{font:inherit;border:2px solid var(--ink);background:#fff;color:var(--ink);padding:7px 11px;border-radius:10px;cursor:pointer}
  button:focus-visible{outline:3px solid var(--rina);outline-offset:2px}
  button.play{background:var(--ink);color:#fff;min-width:62px;font-weight:700}
  .cur{flex:1;min-width:0;font-size:13px;color:#4d555c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .spd{display:flex;gap:3px}
  .spd button{padding:6px 7px;font-size:12px}
  .spd button.on{background:var(--active)}
  .wrap{padding-bottom:55vh}
  .mode{display:flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden;flex:none}
  .mode button{border:none;border-radius:0;padding:7px 9px;font-size:12.5px}
  .mode button+button{border-left:2px solid var(--ink)}
  .mode button.on{background:var(--active);font-weight:700}
  .gate{position:fixed;inset:0;background:rgba(223,231,234,.92);display:flex;align-items:center;justify-content:center;z-index:5}
  .gate.hidden{display:none}
  .gate .box{background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:22px 22px 18px;max-width:300px;text-align:center}
  .gate p{margin:0 0 16px;font-size:14px;line-height:1.55;color:#4d555c}
  .gate button{background:var(--ink);color:#fff;font-weight:700;padding:10px 18px;font-size:15px}
  .end{margin:28px 12px 0;text-align:center;font-size:13px;color:#4d555c}
  @media (prefers-reduced-motion:reduce){.bubble{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>학식 첫날</h1>
    <p>화면을 내리면 말풍선이 화면 가운데쯤 왔을 때 그 대사가 들립니다. 말풍선을 누르면 그 대사를 다시 들을 수 있습니다.</p>
  </header>

        <circle cx="-15" cy="4" r="4" fill="#22262b"/><circle cx="15" cy="4" r="4" fill="#22262b"/>

        <rect x="-34" y="42" width="68" height="110" rx="20" fill="#6f9fd1" stroke="#22262b" stroke-width="2"/>
        <circle cx="0" cy="0" r="38" fill="#f3d6bd" stroke="#22262b" stroke-width="2"/>

<div class="gate" id="gate"><div class="box">
  <p>소리와 함께 보는 웹툰입니다.<br>버튼을 누른 뒤 화면을 내려 보세요.</p>
  <button id="start">소리 켜고 보기</button>
</div></div>

<div class="bar"><div class="in">
  <div class="mode" id="mode"><button data-m="scroll" class="on">스크롤</button><button data-m="auto">연속</button></div>
  <button class="play" id="play" hidden>재생</button>
  <div class="cur" id="cur">처음부터 듣기</div>
  <div class="spd" id="spd">
    <button data-r="0.8">0.8</button><button data-r="1" class="on">1.0</button><button data-r="1.2">1.2</button>
  </div>
</div></div>

<audio id="audio" src="audio.mp3" preload="auto"></audio>

<script>
const LINES=[
  {id:1, panel:1, who:"준호", text:"리나 씨, 점심 먹었어요?",              x:4, y:4, tail:"tl", start:0.5,   end:3.57},
  {id:2, panel:1, who:"리나", text:"아직요. 학생 식당은 어디예요?",        x:44, y:18, tail:"tr", start:5.07,  end:8.97},
  {id:3, panel:1, who:"준호", text:"학생회관 지하에 있어요. 같이 가요.",   x:4, y:39, tail:"tl", start:10.47, end:14.18},
  {id:4, panel:2, who:"리나", text:"메뉴가 많네요. 뭐가 맛있어요?",        x:4, y:2, tail:"tl", start:15.68, end:19.69},
  {id:5, panel:2, who:"준호", text:"오늘은 제육볶음이 맛있어요.",          x:44, y:15, tail:"tr", start:21.19, end:24.07},
  {id:6, panel:2, who:"리나", text:"제육볶음이 뭐예요?",                   x:4, y:32, tail:"tl", start:25.57, end:27.62},
  {id:7, panel:2, who:"준호", text:"돼지고기를 매운 양념에 볶은 거예요.",  x:4, y:48, tail:"tl", start:29.12, end:32.81},
  {id:8, panel:3, who:"리나", text:"매운 건 조금 무서워요.",               x:46, y:6,  tail:"tr", start:34.31, end:37.02},
  {id:9, panel:3, who:"준호", text:"그럼 된장찌개는 어때요? 안 매워요.",   x:4,  y:24, tail:"tl", start:38.52, end:43.25},
  {id:10,panel:3, who:"리나", text:"좋아요. 그걸로 할게요.",               x:46, y:40, tail:"tr", start:44.75, end:47.41},
  {id:11,panel:4, who:"준호", text:"저기 기계에서 식권을 먼저 사요.",      x:4,  y:4,  tail:"tl", start:48.91, end:52.18},
  {id:12,panel:4, who:"리나", text:"네, 고마워요.",                        x:56, y:20, tail:"tr", start:53.68, end:55.87},
];

const audio=document.getElementById('audio'), playBtn=document.getElementById('play'),
      cur=document.getElementById('cur');
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
let current=null, mode='scroll', unlocked=false;
let stopAt=null;          // 스크롤 모드: 한 대사만 틀고 멈출 시각
let queue=[];             // 스크롤 모드: 차례를 기다리는 대사
const TRIGGER=0.55;       // 화면 위에서 55% 지점을 지나면 재생

LINES.forEach(l=>{
  const panel=document.querySelector(`.panel[data-panel="${l.panel}"]`);
  const b=document.createElement('div');
  b.className='bubble '+l.tail; b.dataset.who=l.who; b.tabIndex=0; b.setAttribute('role','button');
  b.style.left=l.x+'%'; b.style.top=l.y+'%';
  b.innerHTML=`<span class="who">${l.who}</span>${l.text}`;
  b.addEventListener('click',()=>tap(l));
  b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tap(l);}});
  panel.appendChild(b); l.el=b; l.passed=false;
});

function mark(l,follow){
  if(current===l)return;
  if(current)current.el.classList.remove('active');
  current=l;
  if(!l)return;
  l.el.classList.add('active');
  cur.textContent=`${l.who}: ${l.text}`;
  if(follow){
    const r=l.el.getBoundingClientRect();
    if(r.top<70||r.bottom>window.innerHeight-90)
      l.el.scrollIntoView({block:'center',behavior:reduce?'auto':'smooth'});
  }
}

/* 한 대사만 재생 (스크롤 모드) */
function playOne(l){
  mark(l,false);
  stopAt=l.end;
  audio.currentTime=l.start;
  audio.play().catch(()=>{});
}
function next(){
  // 이미 화면 위로 멀리 지나간 대사는 건너뛴다
  while(queue.length){
    const l=queue.shift(), r=l.el.getBoundingClientRect();
    if(r.bottom>0){playOne(l);return;}
  }
}
/* 새로 도달한 대사 묶음: 지금 나오는 대사를 끊고 바로 새 대사로 넘어간다 */
let fadeTimer=null;
function jumpTo(batch){
  batch.sort((a,b)=>a.id-b.id);
  queue=batch.slice(1);
  const first=batch[0];
  if(audio.paused){playOne(first);return;}
  // 짧게 소리를 줄이고 넘어가 끊기는 소리를 없앤다
  clearInterval(fadeTimer);
  let v=1; fadeTimer=setInterval(()=>{
    v-=0.25; audio.volume=Math.max(0,v);
    if(v<=0){clearInterval(fadeTimer);audio.volume=1;playOne(first);}
  },20);
}

/* 스크롤 위치 확인 */
function check(){
  if(!unlocked||mode!=='scroll')return;
  const line=window.innerHeight*TRIGGER;
  const batch=[];
  LINES.forEach(l=>{
    const r=l.el.getBoundingClientRect(), mid=r.top+r.height/2;
    if(!l.passed&&mid<line){l.passed=true;batch.push(l);}
    else if(l.passed&&mid>line+40){l.passed=false;}   // 다시 위로 올리면 다음에 또 재생
  });
  if(batch.length)jumpTo(batch);
}
let ticking=false;
window.addEventListener('scroll',()=>{if(!ticking){ticking=true;requestAnimationFrame(()=>{ticking=false;check();});}},{passive:true});
window.addEventListener('resize',check);

/* 말풍선 누르기 */
function tap(l){
  if(!unlocked)unlock();
  if(mode==='scroll'){jumpTo([l]);}
  else{stopAt=null;mark(l,true);audio.currentTime=l.start;audio.play();}
}

audio.addEventListener('timeupdate',()=>{
  const t=audio.currentTime;
  if(stopAt!=null&&t>=stopAt){audio.pause();stopAt=null;next();return;}
  if(mode==='auto'){
    const l=LINES.find(x=>t>=x.start-0.05&&t<x.end+0.3);
    if(l)mark(l,true);
  }
});
audio.addEventListener('play',()=>playBtn.textContent='멈춤');
audio.addEventListener('pause',()=>playBtn.textContent='재생');
audio.addEventListener('ended',()=>{stopAt=null;if(mode==='auto'){mark(null);cur.textContent='다시 듣기';}else next();});

playBtn.addEventListener('click',()=>{ if(audio.paused){if(audio.ended)audio.currentTime=0;audio.play();}else audio.pause(); });

/* 모드 전환 */
document.getElementById('mode').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||b.dataset.m===mode)return;
  mode=b.dataset.m;
  [...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b));
  audio.pause(); stopAt=null; queue=[];
  playBtn.hidden=(mode==='scroll');
  if(mode==='scroll'){
    cur.textContent='화면을 내리면 대사가 들립니다';
    const line=window.innerHeight*TRIGGER;
    LINES.forEach(l=>{const r=l.el.getBoundingClientRect();l.passed=(r.top+r.height/2<line);});
  }else{
    cur.textContent=current?`${current.who}: ${current.text}`:'처음부터 듣기';
  }
});

/* 속도 */
document.getElementById('spd').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  audio.playbackRate=+b.dataset.r;
  [...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b));
});

/* 첫 터치로 소리 허용 (브라우저 정책) */
function unlock(){
  if(unlocked)return;
  unlocked=true;
  document.getElementById('gate').classList.add('hidden');
  cur.textContent='화면을 내리면 대사가 들립니다';
  check();
}
document.getElementById('start').addEventListener('click',()=>{
  // 무음으로 한 번 재생해 두어야 이후 스크롤 재생이 막히지 않는다
  audio.muted=true;
  audio.play().then(()=>{audio.pause();audio.muted=false;audio.currentTime=0;unlock();})
             .catch(()=>{audio.muted=false;unlock();});
});
</script>
</body>
