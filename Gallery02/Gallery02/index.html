<style>
/* Layout: gallery wall — painting stays in view (sticky left on desktop, sticky top on phone), narration text scrolls beside it, player docked at the bottom */
:root{
  --wall:#ECEDEF; --panel:#F7F7F8; --ink:#1E2026; --muted:#666A73; --rule:#D4D6DB;
  --gold:#9A6F17; --gold-wash:rgba(176,132,40,.16); --frame:#2A2B30;
  --dim:rgba(12,12,16,.52);
  --f-text:"Gowun Batang","Noto Serif KR","AppleMyungjo",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --bar-h:84px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --wall:#141518; --panel:#1C1D21; --ink:#E8E6E1; --muted:#9A9DA5; --rule:#2E3036;
  --gold:#DDB45A; --gold-wash:rgba(221,180,90,.16); --frame:#08080A; --dim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --wall:#141518; --panel:#1C1D21; --ink:#E8E6E1; --muted:#9A9DA5; --rule:#2E3036;
  --gold:#DDB45A; --gold-wash:rgba(221,180,90,.16); --frame:#08080A; --dim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--wall);color:var(--ink);font-family:var(--f-ui);}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--wall)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px calc(var(--bar-h) + 40px);
  display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:48px;align-items:start}
.stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 24px);display:flex;flex-direction:column;gap:14px;min-width:0}
.canvas{position:relative;overflow:hidden;background:var(--frame);padding:10px;border-radius:2px;box-shadow:0 18px 40px -22px rgba(0,0,0,.45);cursor:zoom-in}
.canvas-in{position:relative;overflow:hidden}
.canvas img{display:block;width:100%;height:auto}
.spot{position:absolute;border:2px solid var(--gold);border-radius:3px;box-shadow:0 0 0 2000px var(--dim);opacity:0;transition:opacity .5s ease,left .7s ease,top .7s ease,width .7s ease,height .7s ease;pointer-events:none}
.spot.on{opacity:1}
.spot span{position:absolute;left:-2px;bottom:100%;margin-bottom:6px;white-space:nowrap;background:var(--gold);color:#16130B;font:600 12px/1 var(--f-ui);padding:5px 8px;border-radius:2px;letter-spacing:.02em}
.spot.below span{bottom:auto;top:100%;margin:6px 0 0}
.zoom-hint{position:absolute;right:16px;bottom:16px;background:rgba(0,0,0,.55);color:#fff;font:500 11px/1 var(--f-ui);padding:6px 8px;border-radius:2px}
.label{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;color:var(--muted);border-top:1px solid var(--rule);padding-top:12px}
.label b{color:var(--ink);font-weight:600;grid-column:1/-1;font-size:15px}
.label dt{color:var(--muted)} .label dd{margin:0;color:var(--ink)}

.text{min-width:0;max-width:34em}
.series{font-size:12px;letter-spacing:.14em;color:var(--gold);font-weight:600}
h1{font-family:var(--f-text);font-weight:700;font-size:clamp(26px,3.2vw,36px);line-height:1.3;margin:10px 0 6px;text-wrap:balance}
.work{font-family:var(--f-text);font-size:17px;color:var(--muted);margin:0}
.credit{font-size:12px;color:var(--muted);margin:14px 0 30px;padding-bottom:22px;border-bottom:1px solid var(--rule)}
.para{margin:0 0 1.15em}
.ln{display:block;font-family:var(--f-text);font-size:18px;line-height:1.85;padding:1px 8px;margin:0 -8px;border-radius:3px;cursor:pointer;transition:background .25s,color .25s;color:var(--ink)}
.ln:hover{background:var(--gold-wash)}
.ln.past{color:var(--muted)}
.ln.cur{background:var(--gold-wash);color:var(--ink);box-shadow:inset 3px 0 0 var(--gold)}
.ln:focus-visible{outline:2px solid var(--gold);outline-offset:1px}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--rule);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:14px}
.btn{appearance:none;border:0;background:none;color:var(--ink);font:500 13px var(--f-ui);cursor:pointer;border-radius:50%;width:40px;height:40px;display:grid;place-items:center;flex:none}
.btn:hover{background:var(--gold-wash)}
.btn:focus-visible{outline:2px solid var(--gold)}
.play{width:52px;height:52px;background:var(--ink);color:var(--wall)}
.play:hover{background:var(--ink);opacity:.88}
.btn svg{width:22px;height:22px;fill:currentColor}
.play svg{width:24px;height:24px}
.prog{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.nowline{font-family:var(--f-text);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.track{position:relative;height:18px;cursor:pointer;touch-action:none}
.track::before{content:"";position:absolute;left:0;right:0;top:8px;height:3px;background:var(--rule);border-radius:2px}
.fill{position:absolute;left:0;top:8px;height:3px;background:var(--gold);border-radius:2px;width:0}
.knob{position:absolute;top:3px;width:13px;height:13px;margin-left:-6px;border-radius:50%;background:var(--gold);left:0}
.time{font:500 12px var(--f-ui);font-variant-numeric:tabular-nums;color:var(--muted);flex:none;min-width:88px;text-align:right}
.chip{appearance:none;border:1px solid var(--rule);background:none;color:var(--ink);font:500 12px var(--f-ui);padding:6px 10px;border-radius:999px;cursor:pointer;flex:none;font-variant-numeric:tabular-nums}
.chip[aria-pressed="false"]{color:var(--muted)}
.chip:focus-visible{outline:2px solid var(--gold)}

.lb{position:fixed;inset:0;z-index:30;background:rgba(8,8,10,.94);display:flex;flex-direction:column}
.lb-top{display:flex;justify-content:space-between;align-items:center;color:#ddd;font:500 13px var(--f-ui);padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.lb-top button{appearance:none;border:1px solid #555;background:none;color:#fff;font:500 13px var(--f-ui);padding:6px 12px;border-radius:999px;cursor:pointer}
.lb-scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.lb-scroll img{display:block;max-width:none;height:100%;width:auto;min-height:320px;margin:0 auto}

@media (max-width:860px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:22px;padding-top:0}
  .stage{top:env(safe-area-inset-top,0px);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px)) 10px;background:var(--wall);z-index:5;gap:0;border-bottom:1px solid var(--rule)}
  .canvas{padding:6px}
  .label{display:none}
  .ln{font-size:17px}
  .text{max-width:none}
  .skip{display:none}
  .time{min-width:0}
}
@media (max-width:480px){ .nowline{display:none} .chip{padding:6px 8px} .bar-in{gap:8px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;-webkit-text-size-adjust:100%}img{max-width:100%}</style>
</head>

<script>
